<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tambah Produk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2>Tambah Produk</h2>
  <form>
    <div class="mb-3">
      <label for="nama" class="form-label">Nama Produk</label>
      <input type="text" class="form-control" id="nama" placeholder="Masukkan nama produk">
    </div>
    <div class="mb-3">
      <label for="deskripsi" class="form-label">Deskripsi</label>
      <textarea class="form-control" id="deskripsi" rows="3"></textarea>
    </div>
    <div class="mb-3">
      <label for="harga" class="form-label">Harga</label>
      <input type="text" class="form-control" id="harga" placeholder="Masukkan harga">
    </div>
    <div class="mb-3">
      <label for="stok" class="form-label">Stok</label>
      <input type="number" class="form-control" id="stok" placeholder="Masukkan stok">
    </div>
    <div class="mb-3">
      <label for="foto" class="form-label">Foto Produk</label>
      <input type="file" class="form-control" id="foto">
    </div>
    <button type="submit" class="btn btn-success">Simpan</button>
  </form>
</div>
</body>
</html>
